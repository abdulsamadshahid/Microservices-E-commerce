apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 058835008914.dkr.ecr.ap-south-1.amazonaws.com/minichat_frontend:latest
        ports:
        - containerPort: 3000
    env:
      - name: NODE_ENV
        vlue: "production"
      - name: PRODUCT_SERVICE_URL
        vlue: "http://product-service:4001"
      - name: INVENTORY_SERVICE_URL
        vlue: "http://inventory-service:4002"
      - name: ORDER_SERVICE_URL
        vlue: "http://order-service:4003"
