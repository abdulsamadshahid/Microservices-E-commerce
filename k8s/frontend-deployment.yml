apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 058835008914.dkr.ecr.ap-south-1.amazonaws.com/shopsphere_frontend:latest
        ports:
        - containerPort: 3000
        env:
          - name: NODE_ENV
            value: "production"
          - name: PRODUCT_SERVICE_URL
            value: "http://product-service:4001"
          - name: INVENTORY_SERVICE_URL
            value: "http://inventory-service:4002"
          - name: ORDER_SERVICE_URL
            value: "http://order-service:4003"
