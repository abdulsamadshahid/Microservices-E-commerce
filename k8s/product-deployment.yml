apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
  labels:
    service: product
spec:
  replicas: 1
  selector:
    matchLabels:
      service: product
  template:
    metadata:
      labels:
        service: product
    spec:
      containers:
      - name: product-pod
        image: 058835008914.dkr.ecr.ap-south-1.amazonaws.com/shopsphere_product:latest
        ports:
        - containerPort: 4001
      env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: CORS_ORIGIN
          value: "*"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: secrets
              key: DATABASE_URL
